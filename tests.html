<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engine Test Suite — Car Deal Analyzer</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    body { font-family: "IBM Plex Mono", ui-monospace, monospace; background: #fafaf8; color: #16191d; margin: 0; padding: 2rem 1rem; }
    .wrap { max-width: 56rem; margin: 0 auto; }
    h1 { font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .summary { font-size: 1.5rem; font-weight: 600; margin: 0.75rem 0 1.5rem; }
    .pass { color: #0a7d43; }
    .fail { color: #c22f21; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid #d8dad6; }
    li { padding: 0.5rem 0; border-bottom: 1px solid #d8dad6; font-size: 0.8125rem; }
    li .err { display: block; margin-top: 0.25rem; color: #c22f21; font-size: 0.75rem; }
    a { color: #1f4fd8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Car Deal Analyzer — engine test suite</h1>
    <p class="summary" id="summary">running…</p>
    <ul id="results"></ul>
    <p style="font-size:0.75rem;color:#8a9099;margin-top:1.5rem">
      Every number the analyzer shows is produced by the same files tested here.
      <a href="index.html">← back to the site</a>
    </p>
  </div>

  <script src="js/lib/states.js"></script>
  <script src="js/lib/tax.js"></script>
  <script src="js/lib/waterfall.js"></script>
  <script src="js/lib/amortize.js"></script>
  <script src="js/lib/compare.js"></script>
  <script src="js/lib/flags.js"></script>
  <script src="js/lib/score.js"></script>
  <script src="js/lib/checklist.js"></script>
  <script src="js/tests/harness.js"></script>
  <script src="js/tests/fixtures.js"></script>
  <script src="js/tests/engine.test.js"></script>
  <script src="js/tests/flags-score.test.js"></script>
  <script>
    (function () {
      var results = window.CDA.TEST.results
      var passed = results.filter(function (r) { return r.ok }).length
      var failed = results.length - passed
      var summary = document.getElementById("summary")
      summary.textContent = passed + " / " + results.length + " passing" + (failed ? " — " + failed + " FAILING" : "")
      summary.className = "summary " + (failed ? "fail" : "pass")
      document.title = (failed ? "✗ " : "✓ ") + document.title
      var list = document.getElementById("results")
      results.forEach(function (r) {
        var li = document.createElement("li")
        li.innerHTML = (r.ok ? '<span class="pass">ok</span> ' : '<span class="fail">FAIL</span> ') + r.name +
          (r.error ? '<span class="err">' + r.error.replace(/</g, "&lt;") + "</span>" : "")
        list.appendChild(li)
      })
    })()
  </script>
</body>
</html>
